<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="robotBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <!-- Metallic Visor Gradient -->
    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Cyan Glow Gradient -->
    <linearGradient id="eyeGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Drop Shadow & Glow Filters -->
    <filter id="robotGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Rounded Capsule Container -->
  <rect width="120" height="120" rx="36" fill="url(#robotBg)"/>
  <rect x="2" y="2" width="116" height="116" rx="34" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>

  <!-- Antenna -->
  <line x1="60" y1="28" x2="60" y2="16" stroke="#60a5fa" stroke-width="4" stroke-linecap="round"/>
  <circle cx="60" cy="14" r="5" fill="#38bdf8" filter="url(#robotGlow)"/>

  <!-- Ears / Side Bolts -->
  <rect x="18" y="52" width="8" height="20" rx="3" fill="#3b82f6"/>
  <rect x="94" y="52" width="8" height="20" rx="3" fill="#3b82f6"/>

  <!-- Robot Head Base -->
  <rect x="24" y="32" width="72" height="60" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Visor Screen -->
  <rect x="32" y="42" width="56" height="34" rx="12" fill="url(#visorGrad)"/>
  <rect x="32" y="42" width="56" height="34" rx="12" fill="none" stroke="rgba(96,165,250,0.5)" stroke-width="1.5"/>

  <!-- Glowing LED Eyes -->
  <circle cx="48" cy="58" r="6" fill="url(#eyeGlow)" filter="url(#robotGlow)"/>
  <circle cx="72" cy="58" r="6" fill="url(#eyeGlow)" filter="url(#robotGlow)"/>
  <!-- Catchlight in eyes -->
  <circle cx="50" cy="56" r="2" fill="#ffffff"/>
  <circle cx="74" cy="56" r="2" fill="#ffffff"/>

  <!-- Cute Digital Smile Wave -->
  <path d="M50 67 Q60 73 70 67" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" filter="url(#robotGlow)"/>

  <!-- Chest Body Accent -->
  <path d="M38 92 C38 88, 48 86, 60 86 C72 86, 82 88, 82 92 L86 106 L34 106 Z" fill="#2563eb" opacity="0.9"/>
  <!-- Core emblem -->
  <circle cx="60" cy="96" r="4" fill="#38bdf8" filter="url(#robotGlow)"/>
</svg>
