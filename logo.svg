<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="120" height="120" rx="32" fill="url(#logoBg)"/>
  <rect x="2" y="2" width="116" height="116" rx="30" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
  <text x="60" y="74" font-family="'Space Grotesk', -apple-system, sans-serif" font-weight="800" font-size="48" fill="url(#textGrad)" text-anchor="middle" filter="url(#glow)" letter-spacing="-1">MR</text>
  <circle cx="92" cy="74" r="5" fill="#60a5fa"/>
</svg>
