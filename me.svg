<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="36" fill="url(#avatarBg)"/>
  <!-- Code lines background detail -->
  <g opacity="0.15" stroke="#60a5fa" stroke-width="2" stroke-linecap="round">
    <line x1="40" y1="60" x2="180" y2="60"/>
    <line x1="40" y1="90" x2="240" y2="90"/>
    <line x1="40" y1="120" x2="140" y2="120"/>
    <line x1="260" y1="280" x2="360" y2="280"/>
    <line x1="220" y1="310" x2="360" y2="310"/>
  </g>
  <!-- Circle backdrop -->
  <circle cx="200" cy="180" r="100" fill="url(#accentGrad)" opacity="0.25"/>
  <!-- Head & Body Silhouette with Headset/Glasses -->
  <path d="M120 350 C120 280, 150 260, 200 260 C250 260, 280 280, 280 350 Z" fill="url(#accentGrad)"/>
  <circle cx="200" cy="170" r="55" fill="url(#skinGrad)"/>
  <path d="M145 160 C145 110, 255 110, 255 160 C255 130, 145 130, 145 160 Z" fill="#0f172a"/>
  <!-- Glasses -->
  <rect x="165" y="162" width="28" height="18" rx="4" fill="none" stroke="#0f172a" stroke-width="3"/>
  <rect x="207" y="162" width="28" height="18" rx="4" fill="none" stroke="#0f172a" stroke-width="3"/>
  <line x1="193" y1="170" x2="207" y2="170" stroke="#0f172a" stroke-width="3"/>
  <!-- Confident Smile -->
  <path d="M185 198 Q200 210 215 198" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
</svg>
